[project]
name = "sidekick"
version = "0.1.0"
description = "Streamlit agentic chatbot built with LangGraph: tool use, PDF RAG, and human-in-the-loop approvals"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.4",
    "langchain-google-genai>=4.3.4",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "streamlit>=1.61.1",
]